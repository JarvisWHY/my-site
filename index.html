    .page {
      width: 100%;
      max-width: 920px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: visible;
      padding: clamp(32px, 7vw, 72px);
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      line-height: .9;
      letter-spacing: -.065em;
      font-weight: 700;
      max-width: 650px;
    }

    .initials {
      width: 64px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      flex: 0 0 auto;
      transition: transform .25s ease, background .25s ease;
    }

    .initials:hover {
      transform: rotate(6deg) scale(1.05);
      background: rgba(192, 209, 223, 0.459);
    }

    .initials {
      cursor: pointer;
      padding: 0;
      color: var(--text);
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      z-index: 4;
    }

    /* Карточка плавно схлопывается в круг, а круг всё время остаётся на месте */
    .page {
      width: 100%;
      max-width: 920px;
      position: relative;
    }

    .card {
      transition:
        transform .72s cubic-bezier(.22,1,.36,1),
        opacity .55s ease,
        filter .55s ease;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .initials {
      width: 64px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      flex: 0 0 auto;
      cursor: pointer;
      padding: 0;
      color: var(--text);
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      right: clamp(32px, 7vw, 72px);
      top: clamp(32px, 7vw, 72px);
      z-index: 100;
      transition:
        background .25s ease,
        box-shadow .3s ease,
        transform .25s ease;
    }

    .initials:hover {
      transform: rotate(6deg) scale(1.05);
      background: rgba(192, 209, 223, 0.459);
    }

    .initials-text {
      display: block;
      line-height: 1;
    }

    body.is-collapsed-view {
      overflow: hidden;
    }

    /* Круг становится fixed, но сохраняет ту же экранную координату */
    body.is-collapsed-view .initials {
      position: fixed;
      left: var(--initials-left);
      top: var(--initials-top);
      right: auto;
      z-index: 9999;
      margin: 0;
      background: rgba(255,255,255,.72);
      border-color: rgba(255,255,255,.82);
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      transform: none;
    }

    body.is-collapsed-view .initials:hover {
      transform: rotate(6deg) scale(1.05);
      background: rgba(192, 209, 223, 0.55);
    }

    body.is-collapsed-view .card {
      opacity: 0;
      transform:
        translate(var(--collapse-dx), var(--collapse-dy))
        scale(.035);
      filter: blur(1px);
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .initials {
        width: 52px;
        height: 52px;
        right: 28px;
        top: 28px;
        font-size: 15px;
      }
    }

    .intro {
      max-width: 560px;
      color: #5f5b55;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 28px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      text-decoration: none;
      color: var(--text);
      padding: 20px 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,.5);
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease, border-color .22s ease;
      position: relative;
      overflow: visible;
    }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(192, 209, 223, 0.459);
      box-shadow: 0 12px 30px rgba(0,0,0,.06);
      border-color: rgba(23,23,23,.14);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #ece9e3;
      font-size: 18px;
      flex: 0 0 auto;
      transition: transform .25s ease, background .25s ease;
      color: #171717;
    }

    .brand-logo {
      font-weight: 700;
    }

    .brand-logo svg {
      width: 21px;
      height: 21px;
      display: block;
      fill: currentColor;
    }

    .uploaded-logo {
      overflow: hidden;
    }

    .uploaded-logo img {
      width: 24px;
      height: 24px;
      display: block;
      object-fit: contain;
      filter: grayscale(1) brightness(0);
    }

    .telegram-logo svg {
      width: 22px;
      height: 22px;
    }

    .max-logo img {
      width: 25px;
      height: 25px;
      display: block;
      object-fit: contain;
    }

    .label {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .value {
      color: var(--muted);
      font-size: 14px;
    }

    .arrow {
      color: var(--muted);
      font-size: 20px;
      transition: transform .2s ease;
    }

    .link:hover .arrow {
      transform: translateX(4px);
    }

    .link:hover .icon {
      transform: scale(1.08) rotate(-3deg);
      background: var(--accent);
    }

    .links::before {
      content: "";
      display: block;
      width: 42px;
      height: 3px;
      margin: 0 0 18px 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--text), transparent);
      opacity: .18;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 48px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }

    @media (max-width: 620px) {
      body {
        padding: 14px;
      }

      .card {
        border-radius: 24px;
        padding: 28px 20px;
      }

      .top {
        margin-bottom: 48px;
      }

      .initials {
        width: 52px;
        height: 52px;
        font-size: 15px;
      }

      .intro {
        font-size: 15px;
      }

      .link {
        padding: 17px;
      }

      .value {
        font-size: 13px;
      }

      footer {
        flex-direction: column;
        margin-top: 36px;
      }
    }

    <button class="initials" id="initialsButton" type="button" aria-label="Свернуть визитку">
      <span class="initials-text">НВ</span>
    </button>
  </main>

  <script>
    const initialsButton = document.getElementById('initialsButton');
    const initialsText = initialsButton.querySelector('.initials-text');
    const card = document.querySelector('.card');

    initialsButton.addEventListener('click', () => {
      const collapsed = document.body.classList.contains('is-collapsed-view');

      if (!collapsed) {
        // Запоминаем положение круга на экране ДО начала анимации.
        const buttonRect = initialsButton.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();

        document.body.style.setProperty('--initials-left', `${buttonRect.left}px`);
        document.body.style.setProperty('--initials-top', `${buttonRect.top}px`);

        const buttonCenterX = buttonRect.left + buttonRect.width / 2;
        const buttonCenterY = buttonRect.top + buttonRect.height / 2;
        const cardCenterX = cardRect.left + cardRect.width / 2;
        const cardCenterY = cardRect.top + cardRect.height / 2;

        document.body.style.setProperty('--collapse-dx', `${buttonCenterX - cardCenterX}px`);
        document.body.style.setProperty('--collapse-dy', `${buttonCenterY - cardCenterY}px`);

        // Меняем текст и фиксируем круг на его текущем месте.
        initialsText.textContent = 'JK';
        initialsButton.setAttribute('aria-label', 'Развернуть визитку');
        document.body.classList.add('is-collapsed-view');
      } else {
        // Круг остаётся на месте до полного возвращения карточки.
        document.body.classList.remove('is-collapsed-view');

        initialsText.textContent = 'НВ';
        initialsButton.setAttribute('aria-label', 'Свернуть визитку');
      }
    });
  </script>
